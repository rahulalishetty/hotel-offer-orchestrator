services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - temporal-postgres:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.28.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address 127.0.0.1:7233 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  temporal-ui:
    image: temporalio/ui:2.34.0
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8080:8080"

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  api:
    build: .
    stop_grace_period: 40s
    environment:
      PORT: 3000
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: hotel-offer-task-queue
      REDIS_URL: redis://redis:6379
      SUPPLIER_BASE_URL: http://api:3000
      SUPPLIER_A_ENABLED: "true"
      SUPPLIER_B_ENABLED: "true"
    depends_on:
      temporal:
        condition: service_started
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    ports:
      - "3000:3000"

  worker:
    build: .
    stop_grace_period: 40s
    command: ["node", "dist/worker.js"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: hotel-offer-task-queue
      REDIS_URL: redis://redis:6379
      SUPPLIER_BASE_URL: http://api:3000
    depends_on:
      temporal:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  temporal-postgres:
  redis-data:
